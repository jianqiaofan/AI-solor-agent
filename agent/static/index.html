<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设计助手</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230052d9'/%3E%3Cpath d='M16 7v3M11 14h.01M21 14h.01M12 19h8' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3Crect x='8' y='10' width='16' height='13' rx='4' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css?v=10">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path d="M16 6v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="16" cy="5" r="1.3" fill="currentColor"/>
            <rect x="7" y="9" width="18" height="15" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="13" cy="15.5" r="1.4" fill="currentColor"/>
            <circle cx="19" cy="15.5" r="1.4" fill="currentColor"/>
            <path d="M12.5 20h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">设计助手</div>
          <div class="brand-sub">跟踪支架</div>
        </div>
      </div>
      <button id="new-project" class="new-chat" type="button">新建项目</button>
      <div class="section-label">项目</div>
      <div id="projects" class="projects"></div>
      <script id="boot-projects" type="application/json">[]</script>
      <script>
        (function () {
          var node = document.getElementById("boot-projects");
          var root = document.getElementById("projects");
          if (!node || !root) return;
          var items = [];
          try { items = JSON.parse(node.textContent || "[]"); } catch (error) { return; }
          if (!items || !items.length) return;
          window.__BOOT_PROJECTS__ = items;
          root.textContent = "";
          for (var i = 0; i < items.length; i += 1) {
            var button = document.createElement("button");
            button.type = "button";
            button.className = "project";
            button.textContent = items[i].name || "";
            root.appendChild(button);
          }
        })();
      </script>
      <button id="new-chat" class="new-chat is-secondary" type="button" disabled>新对话</button>
      <input id="search" class="search" type="search" placeholder="搜索对话" autocomplete="off" disabled>
      <div class="section-label">对话</div>
      <div id="history" class="history"></div>
      <div class="sidebar-foot">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">正在连接</span>
      </div>
    </aside>

    <main class="conversation">
      <header class="topbar">
        <div class="topbar-titles">
          <div id="project-label" class="project-label">未选择项目</div>
          <h1 id="title">设计助手</h1>
        </div>
        <button id="toggle-panel" class="ghost" type="button" aria-expanded="true" aria-controls="results">收起结果</button>
      </header>
      <div class="banner-wrap">
        <div id="banner" class="banner" hidden></div>
      </div>
      <div id="transcript" class="transcript">
        <div class="column">
          <div id="welcome" class="welcome">
            <div class="welcome-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <path d="M16 6v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="16" cy="5" r="1.3" fill="currentColor"/>
                <rect x="7" y="9" width="18" height="15" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="13" cy="15.5" r="1.4" fill="currentColor"/>
                <circle cx="19" cy="15.5" r="1.4" fill="currentColor"/>
                <path d="M12.5 20h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <h2>先新建一个项目</h2>
            <p>每个项目的对话单独保存，不会和别的项目混在一起。</p>
          </div>
          <div id="messages" class="messages"></div>
        </div>
      </div>
      <div class="composer-wrap">
        <div id="toast" class="toast" hidden></div>
        <form id="composer" class="composer">
          <label class="sr-only" for="input">消息</label>
          <textarea id="input" rows="2" placeholder="请先新建项目" disabled></textarea>
          <div class="composer-bar">
            <span class="hint">Enter 发送，Shift+Enter 换行</span>
            <div class="composer-actions">
              <select id="model" aria-label="模型"></select>
              <button id="send" class="send" type="submit" disabled>发送</button>
            </div>
          </div>
        </form>
      </div>
    </main>

    <aside id="results" class="results">
      <div class="tabs" role="tablist">
        <button type="button" data-tab="files" class="is-active">文件</button>
        <button type="button" data-tab="layout">布置</button>
      </div>
      <div id="result-body" class="result-body">先新建一个项目，这里会列出资料和成果里的文件。</div>
    </aside>
  </div>
  <div id="project-dialog" class="dialog" hidden>
    <form id="project-form">
      <h2>新建项目</h2>
      <p>对话只属于这一个项目。同时会建立独立目录，分别存放设计资料和成果文件。</p>
      <label class="sr-only" for="project-name">项目名称</label>
      <input id="project-name" maxlength="40" placeholder="例如 Barabantt" autocomplete="off">
      <div id="project-error" class="dialog-error" hidden></div>
      <div class="dialog-actions">
        <button id="project-cancel" class="ghost" type="button">取消</button>
        <button class="send" type="submit">创建</button>
      </div>
    </form>
  </div>
  <script src="/static/app.js?v=20"></script>
</body>
</html>
